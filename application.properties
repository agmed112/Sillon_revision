# Configuración común de Sillón. No usar perfiles ni application.yml.
spring.application.name=sillon
server.port=${PORT:8080}
spring.config.import=optional:file:./secrets.properties

# Desarrollo local: MySQL. En Render, Spring Boot recibe SPRING_DATASOURCE_*.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Zona y URL pública del negocio.
sillon.zona-horaria=America/Bogota
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}

# Valores de negocio definidos en el PDF.
sillon.creditos.registro=10
sillon.creditos.pro=300
sillon.creditos.paquete=200
sillon.limite-estilistas-gratis=2

# Los valores por defecto son solo de relleno para desarrollo/pruebas.
# En Render se deben configurar los secretos reales como variables de entorno.
sillon.jwt.secreto=${JWT_SECRETO:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
sillon.jwt.expiracion-minutos=60
sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_placeholder}
sillon.stripe.webhook-secreto=${STRIPE_SECRETO_WEBHOOK:whsec_placeholder}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO:price_placeholder_pro}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:price_placeholder_creditos}
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}

# IA: proveedor principal Gemini con protocolo OpenAI y respaldo Claude.
sillon.ia.gemini.clave=${GEMINI_LLAVE:gemini_placeholder}
sillon.ia.gemini.modelo=${GEMINI_MODELO:gemini-3.5-flash}
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
sillon.ia.claude.url=${CLAUDE_URL:https://api.anthropic.com/v1/messages}
sillon.ia.claude.clave=${CLAUDE_LLAVE:claude_placeholder}
sillon.ia.claude.modelo=${CLAUDE_MODELO:claude-haiku-5-5}
sillon.ia.http.tiempo-conexion=${IA_TIMEOUT_CONEXION:5s}
sillon.ia.http.tiempo-respuesta=${IA_TIMEOUT_RESPUESTA:25s}
sillon.ia.costos.entrada-por-millon=${IA_COSTO_ENTRADA_POR_MILLON:0}
sillon.ia.costos.salida-por-millon=${IA_COSTO_SALIDA_POR_MILLON:0}

# Ruta de Swagger UI solicitada por el taller.
springdoc.swagger-ui.path=/swagger-ui.html
